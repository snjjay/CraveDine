<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- CraveDine favicon: white fork and spoon on brand coral (#E23744).
         ?v=2 makes browsers drop the previously cached icon. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CraveDine - walk-in restaurant deals near you." />
    <meta name="theme-color" content="#D92F3C" />
    <!-- Day/Night theme without a flash of the wrong colours: applies the
         saved choice (MUI's "mui-mode" in localStorage) or, if none, the
         OS preference to <html> before the app loads - the same
         data-light / data-dark attribute the MUI theme uses
         (src/theme/theme.ts, colorSchemeSelector "data"). -->
    <script>
      (function () {
        var scheme = "light";
        try {
          var mode = localStorage.getItem("mui-mode") || "system";
          if (mode === "dark" || (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
            scheme = "dark";
          }
        } catch (e) {}
        var root = document.documentElement;
        root.removeAttribute("data-light");
        root.removeAttribute("data-dark");
        root.setAttribute("data-" + scheme, "");
      })();
    </script>
    <style>
      html { background-color: #FBF9F7; }
      html[data-dark] { background-color: #151311; color-scheme: dark; }
    </style>
    <!-- Brand fonts: Outfit (headings, discounts) and Inter (body/UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" />
    <title>CraveDine</title>
  </head>
  <body>
    <div id="root"></div>  <!-- This is the empty space where React will build my application -->
    <script type="module" src="/src/main.tsx"></script> <!-- In the browser, start my React application from main.tsx -->
  </body>
</html>


<!-- ==========================================================
     FRONTEND FLOW — STEP 1
     ==========================================================

     index.html = ENTRY DOOR of the React application.

     Browser first loads this HTML file.

     Important:

     <div id="root"></div>
     → Empty box where React will place the application.

     <script type="module" src="/src/main.tsx">
     → Tells the browser:
       "Start the React application from main.tsx."

     FLOW:

     🌐 Browser
          ↓
     1. index.html
          ↓
     2. main.tsx
          ↓
     3. App.tsx
          ↓
     4. AppRoutes.tsx
          ↓
     ...

     🔑 Remember:
     index.html = Entry door
     main.tsx   = Starts React

     ========================================================== -->
